<!-- Suite C23: shell fixes. The breadcrumb names the step the person is on, the oversight persona sees its own name and a book overview
     (not the first underwriter's queue), the workflow footer is hidden on the sign-in screen, and the header product list is readable. -->
<script>
(function(){
  var out = [], errs = [];
  window.addEventListener('error', function(e){ errs.push(e.message); });
  function t(name, cond, extra){ out.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? '  [' + extra + ']' : '')); }
  function el(id){ return document.getElementById(id); }
  var toasts = []; window.showToast = function(m){ toasts.push(m); };
  function login(role){ el('loginUserSelect').value = role; el('loginPasswordInput').value = 'x'; submitLogin(); }
  try {
    // ---------- the sign-in screen
    var f = el('workflowBottomFooter');
    t('the workflow footer is not shown on the sign-in screen', document.body.classList.contains('pre-login') && getComputedStyle(f).display === 'none');
    t('the header product list is readable: its options carry their own colours', /rgb\(36, 51, 74\)|rgba\(36, 51, 74/.test(getComputedStyle(document.querySelector('#lobSelect option')).backgroundColor) && getComputedStyle(document.querySelector('#lobSelect option')).color !== getComputedStyle(document.querySelector('#lobSelect option')).backgroundColor);

    // ---------- the breadcrumb follows the step
    login('admin');
    var s = SUBMISSIONS_DATASET.filter(function(x){ return x.lobKey === 'trucking'; })[0] || null;
    if (!s) { loadFixtureCases(); s = SUBMISSIONS_DATASET.filter(function(x){ return x.lobKey === 'trucking'; })[0]; }
    s.completedSteps = [1, 2, 3, 4]; s.currentStep = 5; activeSubmissionId = s.id; selectSubmission(s.id, false);
    var bad = [];
    [1, 3, 4, 5, 6, 7, 8, 9, 10, 11].forEach(function(n){
      goToWorkflowStep(n);
      var crumb = el('breadcrumbList').innerText.replace(/\s+/g, ' ');
      if (crumb.indexOf(WORKFLOW_STEPS[n - 1].title) === -1) bad.push(n + ': ' + crumb);
    });
    t('on every step the breadcrumb ends with that step\'s title', !bad.length, bad.join(' | '));

    // ---------- the oversight persona
    login('compliance');
    t('the Compliance Officer\'s page names Robert Okafor, not the first underwriter', /Robert Okafor/.test(el('intakeDashboardSubtitle').textContent) && !/Sarah Jenkins/.test(el('intakeDashboardSubtitle').textContent), el('intakeDashboardSubtitle').textContent);
    t('and is a book overview, not a work queue with nothing assigned', el('intakeDashboardTitle').textContent === 'Book Overview' && /none of them is assigned to you/.test(el('roleDashboardContainer').innerText) && !/No Work Assigned Yet/.test(el('roleDashboardContainer').innerText));
    login('junior');
    t('an underwriter still gets the work queue under their own name', el('intakeDashboardTitle').textContent === 'My Work Queue' && /Sarah Jenkins/.test(el('intakeDashboardSubtitle').textContent));
    login('admin');
    t('the Head of Underwriting still gets the assignment dashboard', el('intakeDashboardTitle').textContent === 'Assignment Dashboard' && /Priya Nair/.test(el('intakeDashboardSubtitle').textContent));

    t('no page errors', errs.length === 0, errs.join(' | '));
  } catch (e) { out.push('FAIL exception: ' + e.message + ' ' + (e.stack || '').split('\n').slice(0, 3).join(' / ')); }
  var p = document.createElement('pre'); p.id = '__t'; p.textContent = out.join('\n'); document.body.appendChild(p);
})();
</script>
