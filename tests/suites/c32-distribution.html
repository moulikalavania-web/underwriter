    use(Ar); var nq = toasts.length; var gq = guardOf('issueQuote');

    var NQ = clone(demo()); NQ.baas[0].canQuote = false; NQ.baas[0].canBind = false; load(NQ);
    var nb = toasts.length;
    t('where the agreement does not let the MGA quote, issuing the quote is refused and logged', gq.check([]) === false && toasts.slice(nb).some(function(m){ return /Issuing the quote refused \(binding authority\).*does not let FUT Underwriting quote/.test(m); }) && Ar.decisionLog.some(function(d){ return d.decision === 'dd_quote_blocked'; }));
    var bg = guardOf('bind'); nb = toasts.length;
    t('and so is the bind', bg.check([Ar.id]) === false && Ar.decisionLog.some(function(d){ return d.decision === 'dd_bind_blocked'; }) && toasts.slice(nb).some(function(m){ return /The bind refused/.test(m); }));
    load(demo());
    t('with the authority restored, the bind is allowed', bg.check([Ar.id]) === true);
    use(tx); var nh = toasts.length;
    t('a hard-stop limit refuses the bind even though nothing else is wrong', bg.check([tx.id]) === false && toasts.slice(nh).some(function(m){ return /\$350,000 is above the \$300,000 limit and the agreement says decline/.test(m); }));
    use(oh); t('a refer limit does not refuse it here; the carrier layer handles it', bg.check([oh.id]) === true);
    use(Ar); var nc = toasts.length; pcSubmitCancellation();
    t('a cancellation is refused when the binding authority does not allow it', toasts.slice(nc).some(function(m){ return /Cancelling the policy refused \(binding authority\)/.test(m); }) && Ar.decisionLog.some(function(d){ return d.decision === 'dd_cancel_blocked'; }));
    var ne = toasts.length; pcIssueEndorsement();
    t('an endorsement is allowed through to its own rules, which then ask for their own details', !toasts.slice(ne).some(function(m){ return /Endorsing the policy refused \(binding authority\)/.test(m); }));
    var NE = demo(); NE.baas[0].canEndorse = false; load(NE); ne = toasts.length; pcIssueEndorsement();
    t('but refused if the agreement does not allow endorsing', toasts.slice(ne).some(function(m){ return /Endorsing the policy refused \(binding authority\)/.test(m); }) && Ar.decisionLog.some(function(d){ return d.decision === 'dd_endorse_blocked'; }));
    load(demo());

    // ---------- the screens
    login('senior_uw'); use(Ar); showWorkflowPage(AUTH_STEP); renderAuthorityCard(Ar); var txt = el('authorityContainer').innerText;
    t('the authority page shows the chain, the binding authority and what it allows', /Agreements and binding authority for this case/.test(txt) && /Arora & Sons \(broker\)/.test(txt) && /Vikram & Sons \(carrier\)/.test(txt) && /BAA-1/.test(txt) && /May quote/.test(txt) && /May not cancel/.test(txt));
    t('it shows each limit tested, this case against the limit, with the result', /Premium/.test(txt) && /\$100,000/.test(txt) && /\$300,000/.test(txt) && /LIM-5/.test(txt) && /Within authority/.test(txt));
    t('and who owns the case and who else can see it', /Owned by FUT Underwriting \(mga\)/.test(txt) && /Arora & Sons \(broker\)/.test(txt) && /Amwins Specialty Wholesale Brokerage/.test(txt));
    use(oh); renderAuthorityCard(oh); t('a breach shows what happens: refer to the carrier', /Exceeded: refer to the carrier/.test(el('authorityContainer').innerText));
    use(tx); renderAuthorityCard(tx); t('or decline', /Exceeded: decline/.test(el('authorityContainer').innerText));
    var pg = mk('SUB-C32-PG', { program: 'Fleet Select', exposureVal: 1000000 }); var ps = ddProgramShares(pg);
    t('a case in a program shows how its limit splits between the carriers', ps && ps.shares.length === 2 && ps.shares[0].limit === 600000 && ps.shares[0].lead === true && ps.shares[1].limit === 400000);
    use(pg); renderAuthorityCard(pg); t('and the page says so', /Program Fleet Select/.test(el('authorityContainer').innerText) && /Harbor Mutual 40%/.test(el('authorityContainer').innerText));
    login('junior'); renderAuthorityCard(pg); t('an Underwriter I sees the agreements but not the loader', /Agreements and binding authority/.test(el('authorityContainer').innerText) && !el('dd_json'));
    login('senior_uw'); renderAuthorityCard(pg); t('someone who may propose sees the loader with the contract box', !!el('dd_json') && !!el('dd_ref'));
    el('dd_json').value = 'nope'; var nj = toasts.length; ddUiPropose(); t('text that is not JSON is refused', toasts.slice(nj).some(function(m){ return /not valid JSON/.test(m); }));
    el('dd_json').value = JSON.stringify(demo()); el('dd_ref').value = ''; nj = toasts.length; ddUiPropose(); t('a proposal from the page needs the contract', toasts.slice(nj).some(function(m){ return /Cite the contract/.test(m); }) && DD_PENDING === null);
    el('dd_json').value = JSON.stringify(demo()); el('dd_ref').value = 'CONTRACT-2026-09'; ddUiPropose(); t('and with it, is waiting for the approver', !!DD_PENDING && DD_PENDING.contractRef === 'CONTRACT-2026-09'); ddReject();

    // ---------- reset
    ddReset(); t('resetting forgets everything, and the checks stop applying', !ddLoaded() && ddResolve(Ar).applies === false && localStorage.getItem(DD_KEY) === null);
    t('the audit actions are labelled', ['dd_quote_blocked', 'dd_bind_blocked', 'dd_issue_blocked', 'dd_endorse_blocked', 'dd_cancel_blocked'].every(function(k){ return !!AUDIT_ACTION_META[k]; }));
  } catch (e) { out.push('EXCEPTION ' + e.message + ' ' + (e.stack || '').split('\n').slice(0, 5).join(' | ')); }
  try { ddReset(); } catch (e) { /* nothing to reset */ }
  if (errs.length) out.push('PAGE ERRORS: ' + errs.join(' || '));
  var pre = document.createElement('pre'); pre.id = '__t'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
