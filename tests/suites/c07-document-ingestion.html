<!-- Suite C07: document ingestion during submission intake. Real files are built in the page (PDF, DOCX, XLSX, PPTX, CSV, JSON,
     EML, images, a renamed file, a program) and put through the pipeline: detect by content, extract by type, consolidate across
     documents with sources and conflicts, validate, confirm, and keep the originals untouched. -->
<script>
(function(){
  var out = [], errs = [];
  window.addEventListener('error', function(e){ errs.push(e.message); });
  function t(name, cond, extra){ out.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? '  [' + extra + ']' : '')); }
  function el(id){ return document.getElementById(id); }
  var enc = new TextEncoder();
  function u8(s){ return enc.encode(s); }
  function b64(bytes){ var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }
  function cat(arrs){ var n = 0; arrs.forEach(function(a){ n += a.length; }); var o = new Uint8Array(n), p = 0; arrs.forEach(function(a){ o.set(a, p); p += a.length; }); return o; }
  async function deflate(bytes, fmt){ var cs = new CompressionStream(fmt); var w = cs.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(cs.readable).arrayBuffer()); }
  function le16(n){ return new Uint8Array([n & 255, (n >> 8) & 255]); }
  function le32(n){ return new Uint8Array([n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255]); }
  // a ZIP writer: entries [{name, data(Uint8Array), deflate:boolean}]
  async function zip(entries){
    var locals = [], central = [], offset = 0;
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i], name = u8(e.name), raw = e.data, comp = e.deflate ? await deflate(raw, 'deflate-raw') : raw, method = e.deflate ? 8 : 0;
      var local = cat([le32(0x04034b50), le16(20), le16(0), le16(method), le16(0), le16(0), le32(0), le32(comp.length), le32(raw.length), le16(name.length), le16(0), name, comp]);
      central.push(cat([le32(0x02014b50), le16(20), le16(20), le16(0), le16(method), le16(0), le16(0), le32(0), le32(comp.length), le32(raw.length), le16(name.length), le16(0), le16(0), le16(0), le16(0), le32(0), le32(offset), name]));
      locals.push(local); offset += local.length;
    }
    var cd = cat(central);
    return cat(locals.concat([cd, cat([le32(0x06054b50), le16(0), le16(0), le16(entries.length), le16(entries.length), le32(cd.length), le32(offset), le16(0)])]));
  }
  var APP = ['Business Name: Links', 'Business Type: Regional Dry-Van Trucking', 'Years in Business: 6', 'Vehicle Count: 2', 'Annual Mileage: 120,000 miles', 'FEIN: 74-9842109', 'US DOT: 1234567'];
  function pairsOf(lines){ return lines.map(function(l){ var i = l.indexOf(': '); return [l.slice(0, i), l.slice(i + 2)]; }); }
  function docx(lines, deflateIt){ var body = lines.map(function(l){ return '<w:p><w:r><w:t>' + l + '</w:t></w:r></w:p>'; }).join(''); return zip([{ name: '[Content_Types].xml', data: u8('<Types/>') }, { name: 'word/document.xml', data: u8('<?xml version="1.0"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + body + '</w:body></w:document>'), deflate: !!deflateIt }]); }
  function docxTable(pairs){ var rows = pairs.map(function(p){ return '<w:tr><w:tc><w:p><w:r><w:t>' + p[0] + '</w:t></w:r></w:p></w:tc><w:tc><w:p><w:r><w:t>' + p[1] + '</w:t></w:r></w:p></w:tc></w:tr>'; }).join(''); return zip([{ name: 'word/document.xml', data: u8('<w:document xmlns:w="x"><w:body><w:tbl>' + rows + '</w:tbl></w:body></w:document>') }]); }
  function xlsx(pairs){
    var strings = []; function si(s){ var i = strings.indexOf(s); if (i < 0) { strings.push(s); i = strings.length - 1; } return i; }
    var rows = pairs.map(function(p, r){ return '<row r="' + (r + 1) + '"><c r="A' + (r + 1) + '" t="s"><v>' + si(p[0]) + '</v></c><c r="B' + (r + 1) + '" t="s"><v>' + si(p[1]) + '</v></c></row>'; }).join('');
    return zip([{ name: 'xl/workbook.xml', data: u8('<workbook><sheets><sheet name="Application"/></sheets></workbook>') }, { name: 'xl/sharedStrings.xml', data: u8('<sst>' + strings.map(function(s){ return '<si><t>' + s + '</t></si>'; }).join('') + '</sst>') }, { name: 'xl/worksheets/sheet1.xml', data: u8('<worksheet><sheetData>' + rows + '</sheetData></worksheet>'), deflate: true }]);
  }
  function pptx(lines){ return zip([{ name: 'ppt/presentation.xml', data: u8('<p/>') }, { name: 'ppt/slides/slide1.xml', data: u8('<p:sld xmlns:p="p" xmlns:a="a"><p:cSld><p:spTree><p:sp><p:txBody>' + lines.map(function(l){ return '<a:p><a:r><a:t>' + l + '</a:t></a:r></a:p>'; }).join('') + '</p:txBody></p:sp></p:spTree></p:cSld></p:sld>') }]); }
  async function pdf(lines, compress){
    var content = 'BT /F1 12 Tf 72 720 Td ' + lines.map(function(l, i){ return (i ? '0 -16 Td ' : '') + '(' + l.replace(/[()\\]/g, '\\$&') + ') Tj '; }).join('') + 'ET';
    var data = compress ? await deflate(u8(content), 'deflate') : u8(content);
    return cat([u8('%PDF-1.4\n1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n3 0 obj\n<< /Length ' + data.length + (compress ? ' /Filter /FlateDecode' : '') + ' >>\nstream\n'), data, u8('\nendstream\nendobj\ntrailer\n<< /Root 1 0 R >>\n%%EOF')]);
  }
  function docxMixed(paras, rows){
    var p = paras.map(function(l){ return '<w:p><w:r><w:t>' + l + '</w:t></w:r></w:p>'; }).join('');
    var tbl = '<w:tbl>' + rows.map(function(r){ return '<w:tr>' + r.map(function(c){ return '<w:tc><w:p><w:r><w:t>' + c + '</w:t></w:r></w:p></w:tc>'; }).join('') + '</w:tr>'; }).join('') + '</w:tbl>';
    return zip([{ name: 'word/document.xml', data: u8('<w:document xmlns:w="x"><w:body>' + p + tbl + '</w:body></w:document>') }]);
  }
  function xlsxGrid(rows){
    var strings = []; function si(s){ var i = strings.indexOf(s); if (i < 0) { strings.push(s); i = strings.length - 1; } return i; }
    var cols = 'ABCDEFGH';
    var xml = rows.map(function(r, ri){ return '<row r="' + (ri + 1) + '">' + r.map(function(c, ci){ var ref = cols[ci] + (ri + 1); return typeof c === 'number' ? '<c r="' + ref + '"><v>' + c + '</v></c>' : '<c r="' + ref + '" t="s"><v>' + si(c) + '</v></c>'; }).join('') + '</row>'; }).join('');
    return zip([{ name: 'xl/workbook.xml', data: u8('<workbook><sheets><sheet name="Vehicle Schedule"/></sheets></workbook>') }, { name: 'xl/sharedStrings.xml', data: u8('<sst>' + strings.map(function(s){ return '<si><t>' + s + '</t></si>'; }).join('') + '</sst>') }, { name: 'xl/worksheets/sheet1.xml', data: u8('<worksheet><sheetData>' + xml + '</sheetData></worksheet>') }]);
  }
  var PNG = new Uint8Array([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A, 0, 0, 0, 13, 73, 72, 68, 82, 0, 0, 0, 1, 0, 0, 0, 1]);
  var toasts = []; window.showToast = function(m){ toasts.push(m); };
  function last(){ return toasts[toasts.length - 1] || ''; }
  async function one(name, bytes){ var r = await diProcessFile(name, '', bytes, null, 0); return r[0]; }
  function fieldsOf(res){ return diConsolidate({ id: 'T', lobKey: 'trucking', documentExtractions: [] }, [{ name: res.name, kind: res.kind, label: res.label, method: res.method, status: res.status, text: res.text, pages: res.pages, notes: res.notes }]); }
  (async function(){
  try {
    document.getElementById('loginUserSelect').value = 'admin'; document.getElementById('loginPasswordInput').value = 'x'; submitLogin();

    // ---------- detection is by content
    var d = function(b, n){ return diDetectType(b, n).kind; };
    t('a PDF is recognised by its signature', d(await pdf(APP), 'a.pdf') === 'pdf');
    t('an image is recognised by its signature', d(PNG, 'a.png') === 'png' && d(new Uint8Array([0xFF, 0xD8, 0xFF, 0xE0, 0, 0]), 'a.jpg') === 'jpeg' && d(new Uint8Array([0x49, 0x49, 0x2A, 0]), 'a.tif') === 'tiff');
    t('CSV, JSON, EML and text are recognised', d(u8('a,b\n1,2'), 'x.csv') === 'csv' && d(u8('{"a":1}'), 'x.json') === 'json' && d(u8('From: a@b.com\nSubject: Hi\n\nBody'), 'x.eml') === 'eml' && d(u8('hello'), 'x.txt') === 'txt');
    var rDocx = await one('app.docx', await docx(APP)), rXlsx = await one('app.xlsx', await xlsx(pairsOf(APP)));
    t('Word and Excel files are told apart inside the ZIP container', rDocx.kind === 'docx' && rXlsx.kind === 'xlsx');
    var rPptx = await one('app.pptx', await pptx(APP));
    t('PowerPoint is recognised', rPptx.kind === 'pptx');

    // ---------- refusals: nothing is renamed or guessed
    var renamed = await one('Application.pdf', PNG);
    t('a PNG renamed to .pdf is refused, not read', renamed.status === 'rejected' && /content is PNG/.test(renamed.notes.join(' ')), renamed.notes.join(' '));
    var renamedText = await one('Application.docx', u8('Business Name: Links'));
    t('a text file renamed to .docx is refused', renamedText.status === 'rejected');
    var exe = await one('invoice.pdf', new Uint8Array([0x4D, 0x5A, 0x90, 0, 3, 0]));
    t('a program renamed to .pdf is refused', exe.status === 'rejected' && /Programs and scripts/.test(exe.notes.join(' ')));
    t('an empty file is refused', (await one('a.txt', new Uint8Array(0))).status === 'rejected');
    t('a file over the size limit is refused', (await one('big.txt', new Uint8Array(DI_MAX_FILE_BYTES + 1).fill(65))).status === 'rejected');
    var ole = await one('old.doc', new Uint8Array([0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0, 0, 0, 0]));
    t('a legacy binary Office file is unsupported, with advice, and kept', ole.status === 'unsupported' && /safe converter/.test(ole.notes.join(' ')));
    t('an unknown binary format is unsupported', (await one('x.bin', new Uint8Array([1, 2, 3, 0, 9, 9, 200, 201]))).status === 'unsupported');

    // ---------- the example from the brief, through every extractor
    var cases = [
      ['plain text', 'a.txt', u8(APP.join('\n'))],
      ['CSV key/value', 'a.csv', u8(pairsOf(APP).map(function(p){ return p[0] + ',"' + p[1] + '"'; }).join(String.fromCharCode(10)))],
      ['JSON', 'a.json', u8(JSON.stringify({ businessName: 'Links', businessType: 'Regional Dry-Van Trucking', yearsInBusiness: 6, vehicleCount: 2, annualMileage: '120,000 miles', fein: '74-9842109', usDot: '1234567' }))],
      ['Word (stored)', 'a.docx', await docx(APP)],
      ['Word (compressed)', 'b.docx', await docx(APP, true)],
      ['Word table', 'c.docx', await docxTable(pairsOf(APP))],
      ['Excel', 'a.xlsx', await xlsx(pairsOf(APP))],
      ['PowerPoint', 'a.pptx', await pptx(APP)],
      ['PDF (text)', 'a.pdf', await pdf(APP, false)],
      ['PDF (compressed)', 'b.pdf', await pdf(APP, true)]
    ];
    for (var i = 0; i < cases.length; i++) {
      var r = await one(cases[i][1], cases[i][2]), f = fieldsOf(r);
      t(cases[i][0] + ': read as text and mapped to the right fields', r.status === 'extracted' && f.insured === 'Links' && f.operationsProfile.business_type === 'Regional Dry-Van Trucking' && f.operationsProfile.years_in_business === 6 && f.operationsProfile.annual_mileage === 120000 && f.vehicleCount === 2, r.status + ' | ' + r.notes.join(' ') + ' | ' + JSON.stringify(f.operationsProfile) + ' | ' + f.insured);
    }
    var pdfRes = await one('a.pdf', await pdf(APP, true));
    t('the PDF extraction is named, and the field records where it came from', fieldsOf(pdfRes).fieldSources.insured.document === 'a.pdf' && /PDF text/.test(pdfRes.method));

    // ---------- scans and images need OCR; nothing is invented
    var scan = await one('scan.png', PNG);
    t('an image is reported as needing OCR; no text is invented', scan.status === 'needs_ocr' && scan.text === '' && /No OCR service is connected/.test(scan.notes.join(' ')));
    var scannedPdf = await one('scan.pdf', u8('%PDF-1.4\n1 0 obj\n<< /Subtype /Image /Width 10 /Length 4 >>\nstream\nabcd\nendstream\nendobj'));
    t('a PDF with only page images is reported as a scan needing OCR', scannedPdf.status === 'needs_ocr');
    window.DOCUMENT_OCR_PROVIDER = async function(){ return { text: 'Business Name: Scan Co\nFEIN: 12-3456789', confidence: 0.9 }; };
    var ocr = await one('scan.png', PNG);
    t('a connected OCR service is used, with its confidence recorded', ocr.status === 'extracted' && /OCR/.test(ocr.method) && ocr.confidence === 0.9 && fieldsOf(ocr).insured === 'Scan Co');
    delete window.DOCUMENT_OCR_PROVIDER;

    // ---------- email: body, headers and attachments
    var eml = 'From: Broker <b@arora.com>\r\nTo: uw@x.com\r\nSubject: New account\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="BB"\r\n\r\n--BB\r\nContent-Type: text/plain\r\n\r\nPlease quote Links. Business Name: Links\r\n--BB\r\nContent-Type: text/plain; name="app.txt"\r\nContent-Disposition: attachment; filename="app.txt"\r\nContent-Transfer-Encoding: base64\r\n\r\n' + b64(u8('FEIN: 74-9842109\nVehicle Count: 2')) + '\r\n--BB--\r\n';
    var emlRes = await diProcessFile('mail.eml', '', u8(eml), null, 0);
    t('an email is parsed and its attachment is read as its own document', emlRes.length === 2 && emlRes[0].kind === 'eml' && /Subject: New account/.test(emlRes[0].text) && emlRes[1].parent === 'mail.eml' && /74-9842109/.test(emlRes[1].text), emlRes.length + ' ' + (emlRes[0] && emlRes[0].text));

    // ---------- several documents: independent extraction, one record, conflicts kept visible
    var s1 = { name: 'application.pdf', kind: 'pdf', label: 'PDF', method: 'PDF text extraction', status: 'extracted', text: 'Business Name: Links\nFEIN: 74-9842109\nVehicle Count: 2\nEffective Date: 01/01/2027', pages: [{ page: 1, text: 'Business Name: Links\nFEIN: 74-9842109' }, { page: 2, text: 'Vehicle Count: 2\nEffective Date: 01/01/2027' }] };
    var s2 = { name: 'schedule.xlsx', kind: 'xlsx', label: 'Excel', method: 'Spreadsheet parser (XLSX)', status: 'extracted', text: 'Business Name: Links LLC\nFEIN: 12-3456789\nUS DOT: 1234567', pages: [] };
    var merged = diConsolidate({ id: 'T', lobKey: 'trucking', documentExtractions: [] }, [s1, s2]);
    t('values from the first document are kept and the second document fills gaps', merged.insured === 'Links' && merged.fein === '74-9842109' && merged.dot === '1234567');
    t('every field records its document, and the page where the document has pages', merged.fieldSources.fein.document === 'application.pdf' && merged.fieldSources.fein.page === 1 && merged.fieldSources.dot.document === 'schedule.xlsx' && merged.fieldSources.effectiveDate.page === 2);
    t('a disagreement between documents is recorded, not hidden', merged.conflicts.some(function(c){ return c.field === 'fein' && c.others[0].document === 'schedule.xlsx'; }) && merged.conflicts.some(function(c){ return c.field === 'insured'; }));
    t('a value no document states stays empty', merged.mcNumber === null && merged.address === null && !('mcNumber' in merged.fieldSources));

    // ---------- validation
    var v1 = diValidate({ fein: '12', dot: '12', email: 'x', exposureVal: '0', effectiveDate: '01/01/2027', expirationDate: '01/01/2026' }, { vehicleDetails: {}, vehicleCount: 3 });
    t('format and logic checks run: FEIN, DOT, email, limit, dates, vehicle count', ['FEIN', 'DOT', 'email', 'limit', 'Expiration', 'vehicle'].every(function(w){ return v1.some(function(x){ return x.text.indexOf(w) > -1; }); }), v1.map(function(x){ return x.text; }).join(' | '));
    t('a wrong FEIN or date order blocks; the rest only warns', v1.filter(function(x){ return x.level === 'error'; }).length === 2);
    var v2 = diValidate({ fein: '74-9842109', dot: '1234567' }, { vehicleDetails: { 1: {}, 2: {} }, vehicleCount: 3 });
    t('the stated vehicle count is checked against the vehicle schedule', v2.some(function(x){ return /3 vehicle/.test(x.text) && /2 are listed/.test(x.text); }));

    // ---------- end to end on a submission: originals kept, review, validation gate, canonical record
    var files = [['application.pdf', await pdf(APP, true)], ['broker-note.txt', u8('Broker: Arora & Sons\nContact: x\nEffective Date: 01/01/2027\nExpiration Date: 01/01/2028')], ['scan.png', PNG]];
    var sub = { id: 'SUB-EM90001', receivedAt: 'Just Now', slaText: 'Pending Triage', slaCountdown: 'Pending', priority: 'P3', channelType: 'broker', lobKey: 'trucking', lobName: 'Commercial Auto / Trucking', apiSourced: true, insured: '(Pending — See Raw Email)', fein: 'PENDING', rawEmailText: '', rawAttachments: files.map(function(f){ return { name: f[0], type: '', size: f[1].length, base64: b64(f[1]) }; }), docs: files.map(function(f){ return { name: f[0], type: 'pdf', desc: 'Raw Upload • Unprocessed' }; }), ocrFields: [], vehicles: [], drivers: [], losses: [], coverageRows: [], decisionLog: [], canonicalJson: {}, normalizationStatus: 'pending', currentStep: 1, completedSteps: [], assignedTo: null };
    var originals = JSON.stringify(sub.rawAttachments);
    SUBMISSIONS_DATASET.length = 0; SUBMISSIONS_DATASET.push(sub); activeSubmissionId = sub.id;
    var box = el('rawEmailCaptureContainer');
    renderIngestionReviewDirect(sub, box);
    for (var w = 0; w < 100 && !emailIngestionDraftBySubId[sub.id]; w++) await new Promise(function(res){ setTimeout(res, 50); });
    var draft = emailIngestionDraftBySubId[sub.id];
    t('the documents are read when Document Ingestion opens', !!draft && draft.insured === 'Links' && draft.broker === 'Arora & Sons');
    t('the review shows each document, how it was read and the result', /application\.pdf/.test(box.innerHTML) && /PDF text extraction/.test(box.innerHTML) && /scan\.png/.test(box.innerHTML) && /Needs OCR/.test(box.innerHTML));
    t('the file that could not be read is a review reason', draft.review_reasons.some(function(x){ return /scan\.png/.test(x) && /OCR/.test(x); }));
    t('each extracted field shows where it came from', /from application\.pdf/.test(box.innerHTML));
    t('extraction results are stored apart from the originals', sub.documentExtractions.length === 3 && JSON.stringify(sub.rawAttachments) === originals);
    t('the case documents list shows the real state of each file', /Needs OCR/.test(sub.docs[2].desc) && /Read/.test(sub.docs[0].desc) && !/Unprocessed/.test(sub.docs[0].desc));
    diRenderPipelineCard(sub);
    t('the Step 1 card reports the true outcome, not a fixed figure', /2 read, 1 need OCR/.test(el('ocrPipelineCard').textContent) && !/99\.4|100% Normalized|S3 Cloud/.test(el('ocrPipelineCard').textContent), el('ocrPipelineCard').textContent.replace(/\s+/g, ' ').slice(0, 300));

    el('normField_fein').value = '12'; handleNormFieldEdit('fein', el('normField_fein'));
    t('the validation list updates as the reviewer edits', /FEIN must be 9 digits/.test(el('diValidationBox').textContent));
    toasts.length = 0; applyNormalizedDataToSubmission(sub.id);
    t('a malformed FEIN blocks Confirm & Apply', sub.normalizationStatus === 'pending' && /9 digits/.test(last()), last());
    el('normField_fein').value = '74-9842109'; handleNormFieldEdit('fein', el('normField_fein'));
    applyNormalizedDataToSubmission(sub.id);
    t('once corrected it applies', sub.normalizationStatus !== 'pending' && sub.insured === 'Links' && sub.fein === '74-9842109', sub.normalizationStatus + ' ' + sub.insured + ' ' + sub.fein);
    var rec = sub.canonicalJson.canonical_submission_record || {};
    t('the canonical record has the standard shape with null for what is missing', !!rec.business && rec.business.name === 'Links' && rec.business.businessType === 'Regional Dry-Van Trucking' && rec.business.yearsInBusiness === 6 && rec.vehicles.vehicleCount === 2 && rec.vehicles.annualMileage === 120000 && rec.vehicles.mileageUnit === 'miles' && rec.business.mcNumber === null, JSON.stringify(rec).slice(0, 300));
    t('it keeps the source documents, the field sources and who confirmed it', !!rec.source && rec.source.documents.length === 3 && rec.source.documents.some(function(x){ return x.documentName === 'scan.png' && x.status === 'needs_ocr'; }) && rec.source.fieldSources.insured.document === 'application.pdf' && rec.source.status === 'validated_by_user' && !!rec.source.validatedBy);
    t('the originals are still byte-for-byte what was received', JSON.stringify(sub.rawAttachments) === originals);
    t('the extracted-fields list names the source document and carries no invented confidence', sub.ocrFields.length > 0 && sub.ocrFields.every(function(f){ return !/%/.test(f.conf) && !!f.source; }));


    // ---------- loss runs from several insurance companies go into ONE table
    var lrA = await one('CompanyA-lossrun.txt', u8('Acme Mutual Insurance Company - Loss Run\n2024: Rear-end collision, Closed, $12,500 incurred\n2023: Cargo theft, Closed, $30,000 incurred\n2022: Windshield, Closed, $900 incurred'));
    var lrB = await one('CompanyB-lossrun.docx', await docxMixed(['Beacon Casualty Co. Loss Run Report', 'Insurance Carrier: Beacon Casualty Co.'], [['Policy Year', 'Claim Number', 'Description', 'Status', 'Total Incurred'], ['2023', 'B-2201', 'Jackknife on I-35', 'Closed', '$48,200'], ['2021', 'B-1180', 'Trailer fire', 'Open', '$15,000']]));
    var lrC = await one('CompanyC-lossrun.pdf', await pdf(['Summit Indemnity Insurance Company', 'Loss Runs valued 08/01/2026', '2025: Parking lot damage, Closed, $2,100 incurred', '2024: Driver injury, Open, $64,000 incurred', '2022: Hail, Closed, $7,700 incurred', '2020: Collision, Closed, $19,300 incurred'], true));
    var lrSub = { id: 'T-LR', lobKey: 'trucking', documentExtractions: [] };
    var lr = diConsolidate(lrSub, [lrA, lrB, lrC].map(function(r){ return { name: r.name, kind: r.kind, label: r.label, method: r.method, status: r.status, text: r.text, pages: r.pages, notes: r.notes }; }));
    t('the loss runs of three companies (3 + 2 + 4 claims) give one list of 9 claims', lr.lossHistory.length === 9, lr.lossHistory.length + ' claims; ' + [lrA, lrB, lrC].map(function(r){ return r.name + ':' + r.status; }).join(' '));
    var by = function(name){ return lr.lossHistory.filter(function(l){ return l.sourceDocument === name; }).length; };
    t('each claim carries its insurance company and source document', by('CompanyA-lossrun.txt') === 3 && by('CompanyB-lossrun.docx') === 2 && by('CompanyC-lossrun.pdf') === 4 && lr.lossHistory.every(function(l){ return !!l.carrier; }));
    t('the company names are the ones the documents state', ['Acme Mutual Insurance Company', 'Beacon Casualty Co.', 'Summit Indemnity Insurance Company'].every(function(c){ return lr.lossHistory.some(function(l){ return l.carrier === c; }); }), lr.lossHistory.map(function(l){ return l.carrier; }).join(' | '));
    t('claim numbers are kept where the document has them', lr.lossHistory.some(function(l){ return l.claimNo === 'B-2201'; }) && lr.lossHistory.some(function(l){ return l.claimNo === 'B-1180'; }));
