    // ---------- BOR validation and waiting (pure)
    function bor(o){ var f = { toBroker:'Arora & Sons', fromBroker:'Marsh & McLennan', signedByInsured:true, signerName:'Pat Orion', signerTitle:'CFO', docRef:'BOR-LTR-1', signedOn:'2026-10-01', receivedOn:'2026-10-02', effectiveOn:'2026-10-08', incumbentNotifiedOn:'2026-10-03', incumbentConsented:false }; for (var k in (o||{})) f[k]=o[k]; return f; }

    t('incumbent consent skips the waiting period', comBorWaiting(bor({incumbentConsented:true, incumbentNotifiedOn:'', effectiveOn:'2026-10-02'}), '2026-10-08').ok === true);
    t('effective date later than the waiting period governs', comBorWaiting(bor({incumbentNotifiedOn:'2026-10-03', effectiveOn:'2026-10-20'}), '2026-10-08').ok === false);

    // direct submission card
    var DS = mkSub('SUB-DIR', 'Direct Customer (Online Intake)', '11-1111111', 1, { channelType:'direct' });

    t('override needs a reason', !P.commissionOverride);

    var E = mkPolicy('SUB-EM', 'Arora & Sons', 'trucking', { coverageRows: clone(seedT.coverageRows) });
    SUBMISSIONS_DATASET.push(E);

    t('email commission follows the producer agreement, not a fixed 10%', !!figs && figs.commissionRate === 0.15, figs ? String(figs.commissionRate) : 'no figures');

    // ---------- broker change on a bound policy
    COMMISSION_SCHEDULE.find(function(a){return a.id==='AGR-AON-2026';}).rates.gl_cpc.new = 14;
    SUBMISSIONS_DATASET.length = 0;
    var Q = mkPolicy('SUB-Q', 'Marsh & McLennan Commercial Brokerage'); Q.pasSync = { status:'success', policyNumber:'GLC-2026-888001', pasRecordId:'PAS-8', effectiveDate:'2026-01-01' };
    Q.certificates = [{ id:'C1', status:'issued', holderName:'Acme', holderType:'Certificate holder' }];
    SUBMISSIONS_DATASET.push(Q); activeSubmissionId = Q.id;
    recordQuoteVersion(Q, true);
    t('policy locked at the Marsh gl_cpc rate', Q.commission.locked && Q.commission.rate === 12 && Q.commission.amount === 1332);
