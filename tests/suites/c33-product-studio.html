    t('coverages are matched by code, by id or by name', (function(){ var s = mk('SUB-C33-NM'); s.coverageRows = [{ line: 'Bodily Injury Liability' }, { id: 'PD', line: 'x' }, { line: 'UM/UIM', limit: '$300,000' }]; return psCaseCheck(s).missingRequired.length === 0; })());

  } catch (e) { out.push('EXCEPTION ' + e.message + ' ' + (e.stack || '').split('\n').slice(0, 5).join(' | ')); }
